# Auto-generated GitHub release notes
# Used by the "Generate release notes" button and `gh release create --generate-notes`.
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - skip-changelog
      - ignore-for-release
    authors:
      - github-actions[bot]
  categories:
    - title: Breaking changes
      labels:
        - breaking-change
        - breaking
    - title: Features
      labels:
        - enhancement
        - feat
        - feature
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Docs
      labels:
        - documentation
        - docs
    - title: Other
      labels:
        - "*"
