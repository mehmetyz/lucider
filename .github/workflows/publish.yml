name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Set package version from release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          TAG="${RELEASE_TAG#v}"
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be vMAJOR.MINOR.PATCH (got ${RELEASE_TAG})"
            exit 1
          fi
          if [ "$TAG" = "0.0.1" ]; then
            echo "0.0.1 is already on npm as a placeholder. Tag v0.0.2 or newer."
            exit 1
          fi
          TAG="$TAG" node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const tag = process.env.TAG;
            if (pkg.version !== tag) {
              console.log('package.json is ' + pkg.version + '; publishing as ' + tag);
              pkg.version = tag;
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            }
          "
      - run: pnpm check:pack
      - name: Publish to npm
        run: npm publish --access public --provenance
